<!-- ===== PILL BADGE (dot on both sides) — copy & paste anywhere (GHL Custom HTML/JS element works) ===== -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  .pb2-wrap{
    display:flex;justify-content:center;
    padding:0 24px;
    font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  .pb2-pill{
    display:inline-flex;align-items:center;gap:12px;
    border:1px solid rgba(46,229,157,.4);
    background:rgba(46,229,157,.08);
    border-radius:999px;
    padding:11px 24px;
    color:#e6ecf8;font-size:17px;font-weight:400;line-height:1.3;
    text-align:center;
  }
  /* green glowing dot (left) */
  .pb2-pill::before{
    content:"";flex:none;
    width:11px;height:11px;border-radius:50%;
    background:#2ee59d;
    box-shadow:0 0 10px #2ee59d;
  }
  /* small white dot (right) */
  .pb2-pill::after{
    content:"";flex:none;
    width:6px;height:6px;border-radius:50%;
    background:#ffffff;
  }
  @media(max-width:560px){
    .pb2-wrap{padding:0 14px}
    .pb2-pill{font-size:15px;padding:9px 18px;gap:10px}
  }
</style>

<div class="pb2-wrap">
  <div class="pb2-pill">How the Playbook works</div>
</div>
<!-- ===== END PILL BADGE ===== -->
