<!-- ===== TWO-UP CARDS ("Stack enough micro yeses / right") — copy & paste (GHL Custom HTML/JS element) ===== -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap');
  #lr-wrap,#lr-wrap *{box-sizing:border-box}
  #lr-wrap{max-width:900px;margin:0;padding:0 4px}
  #lr-wrap .lr-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  #lr-wrap .lr-card{
    padding:24px 26px 26px;border-radius:20px;
    background:#ffffff;border:1px solid #dbe3ee;
    box-shadow:0 8px 26px rgba(17,17,17,.05);
    font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif !important;
  }
  #lr-wrap .lr-title{margin:0 0 6px;font-size:21px;font-weight:700;line-height:1.3;color:#111111;letter-spacing:-.01em}
  #lr-wrap .lr-text{margin:0;font-size:21px;font-weight:400;line-height:1.6;color:#4b5563}
  @media(max-width:700px){
    #lr-wrap .lr-grid{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    #lr-wrap .lr-card{padding:20px 20px 22px;border-radius:16px}
    #lr-wrap .lr-title,#lr-wrap .lr-text{font-size:18.5px}
  }
</style>

<div id="lr-wrap">
  <div class="lr-grid">
    <div class="lr-card">
      <div class="lr-title">Stack enough micro yeses</div>
      <div class="lr-text">before the number lands and the price almost doesn't matter.</div>
    </div>
    <div class="lr-card">
      <div class="lr-title">Stack micro nos</div>
      <div class="lr-text">and the price becomes the wall.</div>
    </div>
  </div>
</div>
<!-- ===== END TWO-UP CARDS ===== -->
