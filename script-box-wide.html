<!-- ===== WIDE DARK QUOTE CARD WITH ORANGE GLOW (adjustable side margin) — copy & paste (GHL Custom HTML/JS element) =====
     Wide card with a small margin on the left and right of the screen, no matter how narrow the GHL section/column is.
     Change --side to make the margins bigger (e.g. 80px) or smaller (e.g. 16px).
     Edit the label (.sc-label) and the quote (.sc-quote). -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap');
  html,body{overflow-x:hidden}
  #sc-wrap,#sc-wrap *{box-sizing:border-box}
  #sc-wrap{--side:40px}
  #sc-wrap{display:block !important;width:100% !important;max-width:none !important;margin:0 !important;padding:0 !important}

  /* the card: breaks out of any parent, leaving --side of space at each edge of the screen */
  #sc-wrap .sc-band{
    position:relative;overflow:hidden;
    width:calc(100vw - (var(--side) * 2));left:50%;margin-left:calc(-50vw + var(--side));
    border-radius:22px;
    background:#111111;padding:44px 34px;
  }
  /* orange glow, top-right of the screen */
  #sc-wrap .sc-band::after{
    content:"";position:absolute;right:-90px;top:-90px;width:340px;height:340px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,106,0,.55),rgba(255,106,0,0) 70%);
    pointer-events:none;
  }
  /* text starts at the card padding (set a max-width here if you want narrower text) */
  #sc-wrap .sc-inner{position:relative;z-index:1;max-width:none;margin:0}
  #sc-wrap .sc-label{
    margin:0 0 14px;
    font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace !important;
    font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#ff8a1f;line-height:1.4;
  }
  #sc-wrap .sc-quote{
    margin:0;
    font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif !important;
    font-size:23px;font-weight:500;line-height:1.65;color:#ffffff;
  }
  @media(max-width:560px){
    #sc-wrap{--side:14px}
    #sc-wrap .sc-band{padding:28px 20px;border-radius:18px}
    #sc-wrap .sc-quote{font-size:18.5px}
    #sc-wrap .sc-band::after{width:220px;height:220px;right:-70px;top:-70px}
  }
</style>

<div id="sc-wrap">
  <div class="sc-band">
    <div class="sc-inner">
      <div class="sc-label">The pre-frame</div>
      <div class="sc-quote">“I want to be upfront — we're not the cheapest option out there. Good work costs what it costs. But let me show you exactly what you're getting for it.”</div>
    </div>
  </div>
</div>
<!-- ===== END WIDE CARD ===== -->
