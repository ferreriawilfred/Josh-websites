<!-- ===== FUNNEL BACKGROUND EFFECT v2 — blurred colour blocks BEHIND the page + rainbow scroll bar =====
     HOW TO USE (GoHighLevel):
     Funnel > your page > Settings > Custom Code > "Footer Code" (or a Custom JS/HTML element).
     Paste everything below.

     How it works: the colour blocks go into GoHighLevel's own page-background layer (.bg-fixed), so they
     sit BEHIND all your content. White sections are automatically made see-through so the colour shows
     around your text and cards. Black / coloured sections are left alone.
-->
<style>
  /* rainbow progress bar at the very top */
  .fxg-bar{
    position:fixed;top:0;left:0;height:5px;width:0;z-index:99999;pointer-events:none;
    /* gradient is pinned to the full screen width, so the colours are revealed as the bar grows */
    background:linear-gradient(90deg,#ff6a00,#ffd000,#2bd96b,#1aa7ff,#8b5cf6,#ff3d8b) left top/100vw 100% no-repeat;
    box-shadow:0 0 10px rgba(255,106,0,.5);
  }
  /* colour-block layer (lives inside the page background, behind everything) */
  .fxg-blobs{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .fxg-blobs.fxg-body{position:fixed;z-index:-1}     /* fallback if .bg-fixed is missing */
  .fxg-blob{
    position:absolute;width:46vw;height:46vw;max-width:640px;max-height:640px;border-radius:50%;
    filter:blur(90px);opacity:calc(var(--fxg-i,1) * .30);background:hsl(var(--h,25) 100% 62%);will-change:transform;
    transition:background-color 1.2s ease-out,transform .9s ease-out;
  }
  .fxg-blob:nth-child(1){left:-12vw;top:6vh}
  .fxg-blob:nth-child(2){right:-14vw;top:30vh;width:40vw;height:40vw;border-radius:36% 64% 58% 42% / 44% 38% 62% 56%}
  .fxg-blob:nth-child(3){left:14vw;bottom:-18vh;width:36vw;height:36vw}
  .fxg-blob:nth-child(4){right:8vw;bottom:-12vh;width:30vw;height:30vw;border-radius:36% 64% 58% 42% / 44% 38% 62% 56%}
  /* phone: bigger blobs so the colour is actually visible */
  @media(max-width:700px){
    .fxg-blob{width:95vw!important;height:95vw!important;max-width:none!important;max-height:none!important;filter:blur(60px);opacity:calc(var(--fxg-im,1) * .26)}
    .fxg-blob:nth-child(1){left:-30vw;top:2vh}
    .fxg-blob:nth-child(2){right:-35vw;top:34vh}
    .fxg-blob:nth-child(3){left:-20vw;bottom:-6vh}
    .fxg-blob:nth-child(4){right:-25vw;bottom:-2vh}
  }
  /* white sections become see-through (added automatically by the script below) */
  .fxg-clear{background-color:transparent !important;background-image:none !important}
</style>

<script>
(function(){
  if(window.__fxgLoaded) return; window.__fxgLoaded = true;

  /* ---- settings you can change ---- */
  var BLOB_COUNT   = 4;     // 1-4
  var SHOW_BAR     = true;  // rainbow progress bar
  var INTENSITY    = 1;     // 0.5 = softer, 1 = default, 1.5 = stronger
  var MOBILE_INTENSITY = 1; // same idea, but only for phones (screens up to 700px wide)
  var START_HUE    = 20;    // 20 = orange. Colours shift from here as the visitor scrolls
  var HUE_TRAVEL   = 160;   // colour change from top to bottom of the page (small = smooth, big = fast)
  var SPREAD       = 38;    // colour difference between the blobs (small = harmonious)
  var CLEAR_WHITE_SECTIONS = true;   // make white sections see-through so the colour shows (recommended)

  function clearWhite(){
    if(!CLEAR_WHITE_SECTIONS) return;
    var secs=document.querySelectorAll('.c-section');
    for(var i=0;i<secs.length;i++){
      var bg=getComputedStyle(secs[i]).backgroundColor;
      if(bg==='rgb(255, 255, 255)'||bg==='rgba(255, 255, 255, 1)'){ secs[i].classList.add('fxg-clear'); }
    }
  }

  function build(){
    var host=document.querySelector('.bg-fixed');
    var wrap=document.createElement('div'); wrap.className='fxg-blobs'+(host?'':' fxg-body'); wrap.setAttribute('aria-hidden','true');
    for(var i=0;i<BLOB_COUNT;i++){var b=document.createElement('div'); b.className='fxg-blob'; wrap.appendChild(b);}
    wrap.style.setProperty('--fxg-i',INTENSITY);
    wrap.style.setProperty('--fxg-im',MOBILE_INTENSITY);
    (host||document.body).appendChild(wrap);

    var bar=null;
    if(SHOW_BAR){bar=document.createElement('div'); bar.className='fxg-bar'; document.body.appendChild(bar);}
    var blobs=[].slice.call(wrap.children), ticking=false;

    function frame(){
      ticking=false;
      var y=window.pageYOffset||0, vh=window.innerHeight;
      var h=Math.max(1,document.documentElement.scrollHeight-vh), p=Math.min(1,y/h);
      if(bar) bar.style.width=(p*100)+'%';
      blobs.forEach(function(b,i){
        b.style.setProperty('--h',((i*SPREAD+p*HUE_TRAVEL+START_HUE)%360).toFixed(1));
        b.style.transform='translate3d('+(Math.sin(p*6+i)*40)+'px,'+(-y*(0.05+i*0.025)%260)+'px,0)';
      });
    }
    function req(){ if(!ticking){ticking=true;requestAnimationFrame(frame);} }
    window.addEventListener('scroll',req,{passive:true});
    window.addEventListener('resize',req);
    frame();

    // GoHighLevel builds the page after load, so re-check the sections a few times
    clearWhite(); window.addEventListener('load',clearWhite);
    setTimeout(clearWhite,600); setTimeout(clearWhite,1800); setTimeout(clearWhite,4000);
  }
  if(document.body) build(); else document.addEventListener('DOMContentLoaded',build);
})();
</script>
