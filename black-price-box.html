<!-- ===== BLACK PRICE BOX (2 lines, orange numbers) — copy & paste (GHL Custom HTML/JS element) ===== -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&display=swap');
  #bp-wrap,#bp-wrap *{box-sizing:border-box}
  #bp-wrap{display:block !important;width:100% !important;margin:0 auto;padding:4px;font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif !important}
  #bp-wrap .bp-box{background:#111111;border-radius:22px;padding:34px 32px}
  #bp-wrap .bp-line{margin:0;color:#ffffff;font-size:24px;font-weight:700;line-height:1.5;letter-spacing:-.01em}
  #bp-wrap .bp-line + .bp-line{margin-top:30px}
  #bp-wrap .bp-num{color:#ff8a1f;font-size:34px;font-weight:800;letter-spacing:-.02em}
  @media(max-width:560px){
    #bp-wrap .bp-box{padding:24px 20px;border-radius:18px}
    #bp-wrap .bp-line{font-size:19px}
    #bp-wrap .bp-line + .bp-line{margin-top:20px}
    #bp-wrap .bp-num{font-size:27px}
  }
</style>

<div id="bp-wrap">
  <div class="bp-box">
    <div class="bp-line"><span class="bp-num">$1,400+</span> a month to piece it together.</div>
    <div class="bp-line">Or <span class="bp-num">$497</span> to have our team run it.</div>
  </div>
</div>
<!-- ===== END BLACK PRICE BOX ===== -->
