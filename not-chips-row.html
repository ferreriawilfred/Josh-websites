<!-- ===== ✕ CHIPS IN A ROW (wrap to next line) — copy & paste (GHL Custom HTML/JS element) =====
     Edit the text inside each <span>. Add/remove a chip by copying one <div class="nr-chip">. -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&display=swap');
  #nr-wrap,#nr-wrap *{box-sizing:border-box}
  #nr-wrap{max-width:760px;margin:0;padding:4px 6px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px}
  #nr-wrap .nr-chip{
    display:inline-flex;align-items:center;gap:12px;max-width:100%;
    padding:14px 24px;border-radius:10px;
    background:#f3f5f9;border:1px solid #d9dfe9;
    font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif !important;
    font-size:22px;font-weight:500 !important;line-height:1.3;color:#111111;
    opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease;
  }
  #nr-wrap.nr-in .nr-chip{opacity:1;transform:none}
  #nr-wrap.nr-in .nr-chip:nth-child(2){transition-delay:.08s}
  #nr-wrap.nr-in .nr-chip:nth-child(3){transition-delay:.16s}
  #nr-wrap.nr-in .nr-chip:nth-child(4){transition-delay:.24s}
  #nr-wrap .nr-chip svg{flex:none;width:20px;height:20px;display:block}
  @media(max-width:480px){
    #nr-wrap{gap:10px}
    #nr-wrap .nr-chip{font-size:17px;padding:11px 16px;gap:10px}
    #nr-wrap .nr-chip svg{width:16px;height:16px}
  }
  @media(prefers-reduced-motion:reduce){#nr-wrap .nr-chip{opacity:1;transform:none;transition:none}}
</style>

<div id="nr-wrap">
  <div class="nr-chip"><svg viewBox="0 0 20 20" fill="none" stroke="#c0413b" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3.5 3.5l13 13M16.5 3.5l-13 13"/></svg><span>A job photo.</span></div>
  <div class="nr-chip"><svg viewBox="0 0 20 20" fill="none" stroke="#c0413b" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3.5 3.5l13 13M16.5 3.5l-13 13"/></svg><span>A before-and-after.</span></div>
  <div class="nr-chip"><svg viewBox="0 0 20 20" fill="none" stroke="#c0413b" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3.5 3.5l13 13M16.5 3.5l-13 13"/></svg><span>A neighborhood shoutout.</span></div>
</div>

<script>
(function(){
  var w=document.getElementById('nr-wrap'); if(!w) return;
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(e){ if(e[0].isIntersecting){ w.classList.add('nr-in'); io.disconnect(); } },{threshold:.2});
    io.observe(w);
  } else { w.classList.add('nr-in'); }
})();
</script>
<!-- ===== END CHIPS ROW ===== -->
