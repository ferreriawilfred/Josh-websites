<!-- ===== COST ROWS (item + price, 3 rows) — copy & paste (GHL Custom HTML/JS element) ===== -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@700&display=swap');
  #cr-wrap,#cr-wrap *{box-sizing:border-box}
  #cr-wrap{display:block !important;width:100% !important;margin:0 auto;padding:4px;font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif !important}
  #cr-wrap .cr-box{background:#ffffff;border:1px solid #e3e6ec;border-radius:18px;overflow:hidden;box-shadow:0 6px 20px rgba(17,17,17,.04)}
  #cr-wrap .cr-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 24px;border-top:1px solid #e3e6ec}
  #cr-wrap .cr-row:first-child{border-top:0}
  #cr-wrap .cr-item{font-size:19px;font-weight:400;line-height:1.6;color:#111111}
  #cr-wrap .cr-price{
    flex:none;text-align:right;
    font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace !important;
    font-size:15px;font-weight:700;line-height:1.4;color:#d95500;
  }
  @media(max-width:560px){
    #cr-wrap .cr-row{flex-direction:column;align-items:flex-start;gap:6px;padding:16px 18px}
    #cr-wrap .cr-item{font-size:17px}
    #cr-wrap .cr-price{text-align:left;font-size:14px}
  }
</style>

<div id="cr-wrap">
  <div class="cr-box">
    <div class="cr-row"><div class="cr-item">A VA to monitor the inbox and follow up within 5 minutes</div><div class="cr-price">~$800/mo</div></div>
    <div class="cr-row"><div class="cr-item">A setter to qualify leads and book appointments</div><div class="cr-price">~$600/mo</div></div>
    <div class="cr-row"><div class="cr-item">Your own time managing the back-and-forth every evening</div><div class="cr-price">+ your hourly rate</div></div>
  </div>
</div>
<!-- ===== END COST ROWS ===== -->
