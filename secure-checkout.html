<!-- ===== SECURE CHECKOUT BANNER + PAYMENT ICONS — copy & paste (GHL Custom HTML/JS element) ===== -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap');
  #sc-wrap,#sc-wrap *{box-sizing:border-box;font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif !important}
  #sc-wrap{max-width:640px;margin:0 auto;padding:0 6px}

  /* banner */
  #sc-wrap .sc-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  #sc-wrap .sc-lock{
    flex:none;width:56px;height:56px;border-radius:12px;background:#111111;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 14px rgba(17,17,17,.22), inset 0 1px 0 rgba(255,255,255,.12);
  }
  #sc-wrap .sc-lock svg{width:28px;height:28px}
  #sc-wrap .sc-text{flex:1 1 220px;min-width:0}
  #sc-wrap .sc-title{margin:0;color:#111111;font-size:20px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
  #sc-wrap .sc-title b{color:#ff6a00;font-weight:800}
  #sc-wrap .sc-sub{margin:3px 0 0;color:#6b7280;font-size:14px;font-weight:500;line-height:1.3}
  #sc-wrap .sc-pill{
    flex:none;padding:10px 18px;border:1px solid #e5e7eb;border-radius:999px;background:#fff;
    color:#6b7280;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;
    box-shadow:0 2px 8px rgba(17,17,17,.05);
  }
  #sc-wrap .sc-pill b{color:#ff6a00}

  /* divider */
  #sc-wrap .sc-line{height:1px;background:#e5e7eb;margin:18px 0}

  /* payment icons */
  #sc-wrap .sc-cards{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
  #sc-wrap .sc-card{
    position:relative;aspect-ratio:3/2;background:#fff;border:1px solid #e5e7eb;border-top:3px solid #ff6a00;
    border-radius:8px;box-shadow:0 3px 10px rgba(17,17,17,.06);
    display:flex;align-items:center;justify-content:center;padding:4px;
  }
  /* To use an OFFICIAL logo instead, put <img src="LOGO-URL" alt="Visa"> inside the card and delete the <svg> */
  #sc-wrap .sc-card svg,#sc-wrap .sc-card img{width:100%;height:100%;object-fit:contain;display:block}

  @media(max-width:560px){
    #sc-wrap .sc-title{font-size:17px}
    #sc-wrap .sc-cards{grid-template-columns:repeat(4,1fr)}
    #sc-wrap .sc-pill{width:100%;text-align:center}
  }
</style>

<div id="sc-wrap">

  <div class="sc-top">
    <div class="sc-lock">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M7 10V8a5 5 0 0 1 10 0v2" stroke="#ff6a00" stroke-width="2.2" stroke-linecap="round"/>
        <rect x="4.5" y="10" width="15" height="11" rx="2.6" fill="#ff6a00"/>
        <circle cx="12" cy="15" r="1.7" fill="#111111"/>
        <rect x="11.2" y="15.5" width="1.6" height="3" rx=".8" fill="#111111"/>
      </svg>
    </div>
    <div class="sc-text">
      <p class="sc-title">Guaranteed <b>safe &amp; secure</b> checkout</p>
      <p class="sc-sub">256-bit SSL encrypted connection</p>
    </div>
    <div class="sc-pill">Secure <b>payments</b></div>
  </div>

  <div class="sc-line"></div>

  <div class="sc-cards">

    <div class="sc-card" title="Visa">
      <svg viewBox="0 0 80 48" aria-label="Visa"><text x="40" y="31" text-anchor="middle" font-size="22" font-weight="800" font-style="italic" fill="#1a1f71" letter-spacing="-.5">VISA</text></svg>
    </div>

    <div class="sc-card" title="Mastercard">
      <svg viewBox="0 0 80 48" aria-label="Mastercard">
        <circle cx="33" cy="24" r="13" fill="#eb001b"/><circle cx="47" cy="24" r="13" fill="#f79e1b" fill-opacity=".92"/>
        <path d="M40 13.9a13 13 0 0 1 0 20.2 13 13 0 0 1 0-20.2z" fill="#ff5f00"/>
      </svg>
    </div>

    <div class="sc-card" title="American Express">
      <svg viewBox="0 0 80 48" aria-label="American Express"><rect x="8" y="11" width="64" height="26" rx="4" fill="#2e77bc"/><text x="40" y="29" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" letter-spacing=".5">AMEX</text></svg>
    </div>

    <div class="sc-card" title="Apple Pay">
      <svg viewBox="0 0 80 48" aria-label="Apple Pay"><text x="40" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Apple Pay</text></svg>
    </div>

    <div class="sc-card" title="PayPal">
      <svg viewBox="0 0 80 48" aria-label="PayPal"><text x="40" y="29" text-anchor="middle" font-size="16" font-weight="800" font-style="italic"><tspan fill="#003087">Pay</tspan><tspan fill="#009cde">Pal</tspan></text></svg>
    </div>

    <div class="sc-card" title="Google Pay">
      <svg viewBox="0 0 80 48" aria-label="Google Pay"><text x="40" y="30" text-anchor="middle" font-size="16" font-weight="700"><tspan fill="#4285f4">G</tspan><tspan fill="#5f6368"> Pay</tspan></text></svg>
    </div>

    <div class="sc-card" title="UnionPay">
      <svg viewBox="0 0 80 48" aria-label="UnionPay">
        <path d="M18 12h14l-5 20H13z" fill="#e21836"/><path d="M30 12h14l-5 20H25z" fill="#00447c"/><path d="M42 12h13l-5 20H37z" fill="#007b84"/>
        <text x="40" y="43" text-anchor="middle" font-size="8.5" font-weight="700" fill="#333">UnionPay</text>
      </svg>
    </div>

  </div>
</div>
<!-- ===== END SECURE CHECKOUT ===== -->
