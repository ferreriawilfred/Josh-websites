<!-- ===== NUMBERED GLASS CARDS (for a dark section) — copy & paste (GHL Custom HTML/JS element) =====
     Made for a dark background (#111). The cards are see-through white, so the section behind must be dark. -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap');
  #tt-wrap,#tt-wrap *{box-sizing:border-box}
  #tt-wrap{max-width:760px;margin:0;padding:4px;display:grid;gap:14px;font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif !important}
  #tt-wrap .tt-card{
    display:flex;align-items:flex-start;gap:16px;padding:20px 22px;border-radius:16px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    font-size:20px;font-weight:400;line-height:1.5;color:#ffffff;
    opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease;
  }
  #tt-wrap.tt-in .tt-card{opacity:1;transform:none}
  #tt-wrap.tt-in .tt-card:nth-child(2){transition-delay:.12s}
  #tt-wrap .tt-n{
    flex:none;width:34px;height:34px;border-radius:9px;background:#ff6a00;color:#ffffff;
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace !important;font-size:14px;font-weight:700;
  }
  #tt-wrap .tt-t{padding-top:3px}
  @media(max-width:560px){
    #tt-wrap .tt-card{padding:16px 16px;gap:14px;font-size:17.5px}
  }
  @media(prefers-reduced-motion:reduce){#tt-wrap .tt-card{opacity:1;transform:none;transition:none}}
</style>

<div id="tt-wrap">
  <div class="tt-card"><span class="tt-n">1</span><div class="tt-t">The Playbook is already getting homeowners to raise their hand.</div></div>
  <div class="tt-card"><span class="tt-n">2</span><div class="tt-t">And the painter who responds fastest wins the job. Every time.</div></div>
</div>

<script>
(function(){
  var w=document.getElementById('tt-wrap'); if(!w) return;
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(e){ if(e[0].isIntersecting){ w.classList.add('tt-in'); io.disconnect(); } },{threshold:.2});
    io.observe(w);
  } else { w.classList.add('tt-in'); }
})();
</script>
<!-- ===== END NUMBERED GLASS CARDS ===== -->
