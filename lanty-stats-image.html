<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&display=swap');
  .pp-wrap,.pp-wrap *{box-sizing:border-box}

  .pp-media{flex:1 1 48%;min-width:0;border-radius:16px;overflow:hidden;background:#111111;border:1px solid rgba(255,106,0,0.35);box-shadow:0 18px 40px rgba(17,17,17,.18);}
  .pp-media img{display:block;width:100%;height:auto;}
  .pp-list{flex:1 1 52%;min-width:0;}

  .pp-card{display:flex;align-items:center;padding:14px 20px;gap:16px;border-radius:6px;background:rgba(255,106,0,0.06);border:1px solid rgba(255,106,0,0.25);}

  .pp-divider-v{width:1px;height:22px;background:rgba(255,106,0,0.3);flex-shrink:0;}
  .pp-note{font-size:18px;color:#374151;font-weight:600;}
  @media(max-width:820px){
    .pp-wrap{flex-direction:column;gap:18px;}
    .pp-media,.pp-list{flex:none;width:100%;}
  }
  @media(max-width:480px){
    .pp-card{padding:12px 14px;gap:12px;}
    .pp-amount{font-size:19px;min-width:88px;}
    .pp-note{font-size:16px;}
  }
</style>
