<!-- ===== LANDING PAGE — "YOU CAN ADD PHOTOS NEXT" TEASER (Custom HTML/Code element, right below the prayer form) ===== -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap');
  .pg-up{max-width:560px;margin:22px auto 0;font-family:'Inter',sans-serif;color:#2c2420}
  .pg-up *{box-sizing:border-box}
  .pg-up-card{background:#fffaf0;border:1px solid rgba(138,36,50,.18);border-radius:18px;padding:28px 24px 24px;text-align:center;box-shadow:0 10px 30px rgba(138,36,50,.08)}
  .pg-up-eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:700;color:#8a2432;margin:0 0 10px}
  .pg-up-title{font-family:'Playfair Display',serif;font-weight:800;font-size:28px;line-height:1.2;color:#2c2420;margin:0 0 12px}
  .pg-up-text{font-size:17px;line-height:1.55;color:#4a3f38;margin:0 0 18px}
  .pg-up-text strong{color:#8a2432}
  .pg-up-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 16px}
  .pg-up-chips span{background:rgba(246,223,174,.45);border:1px solid rgba(201,154,78,.6);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:#6e1c27}
  .pg-up-priv{font-size:13px;color:#7a6f66;margin:0}
  @media(max-width:480px){.pg-up-title{font-size:24px}.pg-up-text{font-size:16px}}
</style>

<div class="pg-up">
  <div class="pg-up-card">
    <p class="pg-up-eyebrow">✦ After You Send Your Prayer</p>
    <h3 class="pg-up-title">Have More On Your Heart?</h3>
    <p class="pg-up-text">Once your prayer letter is sent, <strong>you'll be able to upload photos</strong> of what else you're carrying. I'll hold them in my hands while I pray.</p>
    <div class="pg-up-chips">
      <span>📷 A loved one</span>
      <span>📄 A medical report</span>
      <span>🧾 A bill</span>
      <span>🏠 Your home</span>
    </div>
    <p class="pg-up-priv">🔒 Private. Seen only by me. Never shared.</p>
  </div>
</div>
