<!-- ===== ORANGE LINE CARDS (orange left bar, stacked) — copy & paste (GHL Custom HTML/JS element) =====
     Edit the text inside each <div class="ol-line">. Add a line by copying one. -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@700&display=swap');
  #ol-wrap,#ol-wrap *{box-sizing:border-box}
  #ol-wrap{display:grid !important;gap:10px;width:100% !important;max-width:820px;margin:0;padding:4px}
  #ol-wrap .ol-line{
    padding:15px 20px;border-radius:12px;background:#fff1e6;border-left:4px solid #ff6a00;
    font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif !important;
    font-size:19px;font-weight:700 !important;line-height:1.5;color:#111111;
    opacity:0;transform:translateY(12px);transition:opacity .5s ease,transform .5s ease;
  }
  #ol-wrap.ol-in .ol-line{opacity:1;transform:none}
  #ol-wrap.ol-in .ol-line:nth-child(2){transition-delay:.08s}
  #ol-wrap.ol-in .ol-line:nth-child(3){transition-delay:.16s}
  #ol-wrap.ol-in .ol-line:nth-child(4){transition-delay:.24s}
  @media(max-width:560px){
    #ol-wrap .ol-line{padding:13px 16px;font-size:17px}
  }
  @media(prefers-reduced-motion:reduce){#ol-wrap .ol-line{opacity:1;transform:none;transition:none}}
</style>

<div id="ol-wrap">
  <div class="ol-line">For $20 more — you are not choosing between two scripts.</div>
  <div class="ol-line">You are choosing between one tool and a complete closing system.</div>
</div>

<script>
(function(){
  var w=document.getElementById('ol-wrap'); if(!w) return;
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(e){ if(e[0].isIntersecting){ w.classList.add('ol-in'); io.disconnect(); } },{threshold:.2});
    io.observe(w);
  } else { w.classList.add('ol-in'); }
})();
</script>
<!-- ===== END ORANGE LINES ===== -->
