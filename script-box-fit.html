<!-- ===== DARK QUOTE / SCRIPT BOX — FILLS THE COLUMN WIDTH (no vw tricks) — copy & paste (GHL Custom HTML/JS element) =====
     Edit the label (.sc-label) and the quote (.sc-quote). -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap');
  #sc-wrap,#sc-wrap *{box-sizing:border-box}
  #sc-wrap{display:block !important;width:100% !important;max-width:none !important;min-width:0 !important;margin:0 !important;padding:0 !important}
  #sc-wrap .sc-box{
    position:relative;overflow:hidden;width:100%;
    padding:30px 34px 32px;border-radius:22px;background:#111111;
  }
  /* orange glow, top-right */
  #sc-wrap .sc-box::after{
    content:"";position:absolute;right:-70px;top:-70px;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,106,0,.55),rgba(255,106,0,0) 70%);
    pointer-events:none;
  }
  #sc-wrap .sc-label{
    position:relative;z-index:1;margin:0 0 14px;
    font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace !important;
    font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#ff8a1f;line-height:1.4;
  }
  #sc-wrap .sc-quote{
    position:relative;z-index:1;margin:0;
    font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif !important;
    font-size:23px;font-weight:500;line-height:1.65;color:#ffffff;overflow-wrap:break-word;
  }
  @media(max-width:560px){
    #sc-wrap .sc-box{padding:24px 22px 26px;border-radius:18px}
    #sc-wrap .sc-quote{font-size:18.5px}
    #sc-wrap .sc-box::after{width:200px;height:200px}
  }
</style>

<div id="sc-wrap">
  <div class="sc-box">
    <div class="sc-label">The pre-frame</div>
    <div class="sc-quote">“I want to be upfront — we're not the cheapest option out there. Good work costs what it costs. But let me show you exactly what you're getting for it.”</div>
  </div>
</div>
<!-- ===== END SCRIPT BOX ===== -->
