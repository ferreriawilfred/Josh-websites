<!-- ===== BEFORE / AFTER SLIDER — copy & paste (GHL Custom HTML/JS element) =====
     1) Upload your two photos to the GHL media library and paste their URLs in data-before / data-after below
        (use two photos taken from the same spot, same size, e.g. 1600×1200).
     2) You can paste this element more than once on a page, each one with its own photos. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
  .bas,.bas *{box-sizing:border-box}
  .bas{display:block !important;width:100% !important;max-width:760px;margin:0 auto;padding:6px 4px}
  .bas .bas-box{position:relative;aspect-ratio:4/3;border-radius:22px;overflow:hidden;background:#d9dde2;
                box-shadow:0 18px 44px rgba(38,40,43,.22);user-select:none;-webkit-user-select:none;touch-action:pan-y}
  .bas .bas-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;max-width:none}
  .bas .bas-before{clip-path:inset(0 50% 0 0)}
  .bas .bas-line{position:absolute;top:0;bottom:0;left:50%;width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.35);pointer-events:none}
  .bas .bas-knob{position:absolute;top:50%;left:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#fff;
                 box-shadow:0 4px 14px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font:700 20px Arial,sans-serif;color:#26282b;pointer-events:none}
  .bas .bas-tag{position:absolute;bottom:14px;padding:7px 14px;border-radius:7px;color:#fff;pointer-events:none;
                font-family:'Barlow Condensed',Impact,'Arial Narrow',sans-serif;font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;line-height:1}
  .bas .bas-tag.b{left:14px;background:rgba(38,40,43,.9)}
  .bas .bas-tag.a{right:14px;background:#3a7d52}
  .bas input[type=range]{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;touch-action:pan-y;-webkit-appearance:none;appearance:none}
  .bas .bas-box:focus-within{outline:3px solid rgba(245,166,35,.7);outline-offset:3px}
  .bas .bas-cap{margin:12px 0 0;text-align:center;font-family:'Barlow',system-ui,sans-serif;font-weight:700;font-size:14px;color:#26282b}
  @media(max-width:600px){
    .bas .bas-box{border-radius:16px}
    .bas .bas-knob{width:42px;height:42px;margin:-21px 0 0 -21px}
    .bas .bas-tag{font-size:13px;padding:6px 11px;bottom:10px}
  }
</style>

<div class="bas" data-before="" data-after="">
  <div class="bas-box">
    <img class="bas-a" alt="After painting" width="1200" height="900" loading="lazy">
    <img class="bas-before bas-b" alt="Before painting" width="1200" height="900" loading="lazy">
    <span class="bas-tag b">Before</span><span class="bas-tag a">After</span>
    <input type="range" min="0" max="100" value="50" aria-label="Drag to compare before and after">
    <span class="bas-line"></span><span class="bas-knob">⇄</span>
  </div>
  <p class="bas-cap">Drag the slider</p>
</div>

<script>
(function(){
  /* Sample drawing used until you paste your own photo URLs in data-before / data-after */
  function house(c1,c2,c3){
    var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><rect width="400" height="300" fill="'+c1+'"/><rect y="215" width="400" height="85" fill="'+c3+'"/><polygon points="70,125 200,45 330,125" fill="'+c2+'" opacity=".85"/><rect x="85" y="125" width="230" height="110" fill="'+c2+'"/><rect x="170" y="165" width="60" height="70" fill="#3b3f46"/><rect x="105" y="150" width="45" height="38" fill="#e9edf2"/><rect x="250" y="150" width="45" height="38" fill="#e9edf2"/></svg>';
    return 'data:image/svg+xml;utf8,'+encodeURIComponent(s);
  }
  document.querySelectorAll('.bas').forEach(function(root){
    if(root.__bas) return; root.__bas=true;
    var a=root.querySelector('.bas-a'), b=root.querySelector('.bas-b'), r=root.querySelector('input[type=range]'),
        line=root.querySelector('.bas-line'), knob=root.querySelector('.bas-knob');
    b.src=root.getAttribute('data-before')||house('#cfd8e3','#8a8178','#7a8a6a');
    a.src=root.getAttribute('data-after') ||house('#bfe0ff','#f4f6f8','#5f9a63');
    function set(v){ b.style.clipPath='inset(0 '+(100-v)+'% 0 0)'; line.style.left=v+'%'; knob.style.left=v+'%'; }
    r.addEventListener('input',function(){ set(+r.value); }); set(+r.value);
  });
})();
</script>
