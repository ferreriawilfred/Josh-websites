<!-- ===== STATS ROW (4 white cards) — copy & paste (GHL Custom HTML/JS) ===== -->
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
  .st,.st *{box-sizing:border-box}
  .st{display:block !important;width:100% !important;max-width:1000px;margin:0 auto;padding:6px;font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
  .st .st-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .st .st-card{background:#fff;border:1px solid #e4e2da;border-radius:22px;padding:26px 14px 22px;text-align:center;box-shadow:0 8px 26px rgba(38,40,43,.08)}
  .st .st-num{display:block;margin:0 0 6px;font-family:'Barlow Condensed',Impact,'Arial Narrow',sans-serif;font-weight:700;font-size:54px;line-height:1;color:#26282b}
  .st .st-lbl{display:block;margin:0;font-size:17px;line-height:1.4;color:#6b6f76}
  @media(max-width:760px){
    .st .st-grid{grid-template-columns:repeat(2,1fr);gap:12px}
    .st .st-card{padding:20px 10px 18px;border-radius:18px}
    .st .st-num{font-size:42px}
    .st .st-lbl{font-size:15.5px}
  }
</style>
<div class="st"><div class="st-grid">
  <div class="st-card"><span class="st-num">$4M+</span><span class="st-lbl">Gross revenue over 5 years</span></div>
  <div class="st-card"><span class="st-num">$1M</span><span class="st-lbl">On track this year</span></div>
  <div class="st-card"><span class="st-num">25%</span><span class="st-lbl">Profit margins</span></div>
  <div class="st-card"><span class="st-num">$15</span><span class="st-lbl">Cost per lead</span></div>
</div></div>
