<!-- ===== SURVEY SKIN v3.1 — made for the NATIVE GHL Survey (uses GHL's real class names) =====
     Paste in ONE Custom HTML/JS element on the same page as your Survey element. Remove the older skin (v1 / v2) first.
     Result: full-width pill options with a gap between them, centered text, Next / Back in one color (no blue arrows),
     and AUTO-NEXT: picking an option moves to the next slide by itself (AUTO_NEXT=false to turn off).
     Optional: give the "BOOK YOUR FREE ESTIMATE" heading the Custom Class  ppr-title  for the condensed font. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
  /* fonts */
  .ghl-form-wrap,.ghl-form-wrap *,.ghl-footer,.ghl-footer *{font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif !important}
  .ppr-title,.ppr-title *{font-family:'Barlow Condensed',Impact,'Arial Narrow',sans-serif !important;font-weight:700 !important;text-transform:uppercase !important;letter-spacing:.01em !important}

  /* the list of options of one question */
  [id$="-bubble-option-container"]{display:grid !important;grid-template-columns:1fr !important;gap:10px !important;width:100% !important}
  [id$="-bubble-option-container"]:has(> .option-radio:nth-child(2):last-child){grid-template-columns:1fr 1fr !important}   /* exactly 2 options (e.g. Yes / No) side by side */

  /* each option = one full-width pill; the whole pill is clickable */
  .option-radio{position:relative !important;display:block !important;width:100% !important;margin:0 !important;padding:0 !important;
                border:1px solid #e4e2da !important;border-radius:10px !important;background:#ffffff !important;
                cursor:pointer;transition:border-color .15s,background .15s}
  .option-radio:hover{border-color:#b9b6aa !important}
  .option-radio .standard-radio-container{display:block !important;min-height:0 !important;padding:0 !important;margin:0 !important}
  [id$="-bubble-option-container"]:has(> .option-radio:nth-child(2):last-child) .option-radio label{min-height:62px !important}
  /* the native radio dot is hidden; the whole label (= the whole pill) is the click target */
  .option-radio input[type=radio]{position:absolute !important;left:0 !important;top:0 !important;opacity:0 !important;pointer-events:none !important}
  .option-radio label{display:flex !important;align-items:center !important;justify-content:center !important;width:100% !important;min-height:50px !important;
                margin:0 !important;padding:10px 16px !important;box-sizing:border-box !important;text-align:center !important;cursor:pointer !important;
                color:#26282b !important;font-size:16px !important;font-weight:500 !important;line-height:1.3 !important}
  /* selected */
  .option-radio:has(input:checked),.option-radio.ppr-sel{background:#f6f5f0 !important;border-color:#26282b !important}
  .option-radio:has(input:checked) label,.option-radio.ppr-sel label{font-weight:600 !important}
  .option-radio:focus-within{outline:3px solid rgba(245,166,35,.55);outline-offset:2px}

  /* Next / Back: text + arrow in ONE color */
  .ghl-footer-next,.ghl-footer-back{background:transparent !important;font-size:20px !important;font-weight:600 !important;cursor:pointer}
  .ghl-footer-next,.ghl-footer-next *{color:#26282b !important}
  .ghl-footer-next svg,.ghl-footer-next svg *{stroke:#26282b !important}
  .ghl-footer-back,.ghl-footer-back *{color:#6b6f76 !important}
  .ghl-footer-back svg,.ghl-footer-back svg *{stroke:#6b6f76 !important}
  .ghl-footer-next:hover,.ghl-footer-back:hover{opacity:.7}
  @media(max-width:600px){
    .option-radio label{font-size:15.5px !important;padding:10px 12px !important}
    .ghl-footer-next,.ghl-footer-back{font-size:18px !important}
  }
</style>

<script>
(function(){
  if(window.__pprSkin3) return; window.__pprSkin3=true;
  var AUTO_NEXT=true;   // true = picking an option goes to the next slide automatically
  var AUTO_DELAY=280;   // ms, so the person sees their choice highlight first

  /* selected look for browsers without :has() */
  function sync(){
    document.querySelectorAll('.option-radio').forEach(function(o){
      var r=o.querySelector('input[type=radio]'); o.classList.toggle('ppr-sel',!!(r&&r.checked));
    });
  }
  document.addEventListener('change',function(e){
    var r=e.target; if(!r||!r.matches||!r.matches('.option-radio input[type=radio]')) return;
    sync();
    if(!AUTO_NEXT) return;
    var opt=r.closest('.option-radio');
    function press(){ var nx=document.querySelector('.ghl-footer-next'); if(nx && nx.getAttribute('aria-disabled')!=='true') nx.click(); }
    setTimeout(press,AUTO_DELAY);
    /* safety: if this slide is still showing a moment later, press Next once more */
    setTimeout(function(){ if(opt && opt.getBoundingClientRect().height>0 && r.checked) press(); },AUTO_DELAY+900);
  },true);
  /* clicking anywhere on the pill (even outside the label) selects it */
  document.addEventListener('click',function(e){
    var o=e.target&&e.target.closest&&e.target.closest('.option-radio');
    if(o && !e.target.closest('label') && !(e.target.matches&&e.target.matches('input'))){
      var r=o.querySelector('input[type=radio]'); if(r && !r.checked) r.click();
    }
    setTimeout(sync,0);
  },true);
  setTimeout(sync,500);
})();
</script>
