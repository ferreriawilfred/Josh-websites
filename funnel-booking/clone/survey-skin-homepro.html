<!-- ===== SURVEY SKIN — HOME PRO JOBS (v4) — for the NATIVE GHL Survey =====
     Paste in ONE Custom HTML/JS element on the same page as your Survey element. Remove any older skin (v1/v2/v3) first.
     What it does: big easy-to-tap answer cards (orange when selected, with a round tick), one orange Next button, a quiet Back button,
     DM Sans font, and AUTO-NEXT (picking an answer moves on by itself; set AUTO_NEXT=false to turn off). -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--hp-acc:#ff6a00;--hp-accd:#d95500;--hp-soft:#fff1e6;--hp-line:#ffd9bd;--hp-ink:#111111}

  /* font */
  .ghl-form-wrap,.ghl-form-wrap *,.ghl-footer,.ghl-footer *{font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif !important}
  .ghl-form-wrap{color:var(--hp-ink)}
  /* the question text */
  .ghl-form-wrap label.field-label{display:block !important;margin:0 0 14px !important;color:var(--hp-ink) !important;font-size:23px !important;font-weight:800 !important;line-height:1.25 !important}
  .ghl-form-wrap label.field-label *{color:inherit !important;font-weight:inherit !important}
  .ghl-form-wrap .field-label .required,.ghl-form-wrap label.field-label span{color:var(--hp-acc) !important}

  /* list of answers */
  [id$="-bubble-option-container"]{display:grid !important;grid-template-columns:1fr !important;gap:12px !important;width:100% !important}
  [id$="-bubble-option-container"]:has(> .option-radio:nth-child(2):last-child){grid-template-columns:1fr 1fr !important}  /* exactly 2 answers (Yes / No) side by side */

  /* each answer = one big card, the whole card is clickable */
  .option-radio{position:relative !important;display:block !important;width:100% !important;margin:0 !important;padding:0 !important;
                border:2px solid var(--hp-line) !important;border-radius:16px !important;background:#ffffff !important;
                box-shadow:0 2px 0 rgba(255,106,0,.08);cursor:pointer;transition:border-color .15s,background .15s,transform .15s,box-shadow .15s}
  .option-radio:hover{border-color:var(--hp-acc) !important;transform:translateY(-1px);box-shadow:0 8px 20px rgba(255,106,0,.16)}
  .option-radio .standard-radio-container{display:block !important;min-height:0 !important;padding:0 !important;margin:0 !important}
  .option-radio input[type=radio]{position:absolute !important;left:0 !important;top:0 !important;opacity:0 !important;pointer-events:none !important}
  .option-radio label{display:flex !important;align-items:center !important;justify-content:space-between !important;gap:12px !important;width:100% !important;min-height:62px !important;
                margin:0 !important;padding:12px 18px !important;box-sizing:border-box !important;text-align:left !important;cursor:pointer !important;
                color:var(--hp-ink) !important;font-size:19px !important;font-weight:700 !important;line-height:1.3 !important}
  /* round tick on the right */
  .option-radio label::after{content:"";flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--hp-line);box-sizing:border-box;background:#fff center/14px no-repeat;transition:all .15s}
  /* selected */
  .option-radio:has(input:checked),.option-radio.ppr-sel{background:var(--hp-soft) !important;border-color:var(--hp-acc) !important;box-shadow:0 8px 20px rgba(255,106,0,.18)}
  .option-radio:has(input:checked) label::after,.option-radio.ppr-sel label::after{
    border-color:var(--hp-acc);background-color:var(--hp-acc);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 14 14'><path d='M2.5 7.5l3 3 6-6.5' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/></svg>")}
  .option-radio:focus-within{outline:3px solid rgba(255,106,0,.45);outline-offset:2px}
  /* Yes / No cards: centered */
  [id$="-bubble-option-container"]:has(> .option-radio:nth-child(2):last-child) .option-radio label{justify-content:center !important;min-height:68px !important}
  [id$="-bubble-option-container"]:has(> .option-radio:nth-child(2):last-child) .option-radio label::after{display:none}

  /* text boxes (optional question + contact slide) */
  .ghl-form-wrap textarea,.ghl-form-wrap input[type=text],.ghl-form-wrap input[type=email],.ghl-form-wrap input[type=tel],.ghl-form-wrap input[type=number]{
    border:2px solid var(--hp-line) !important;border-radius:12px !important;font-size:18px !important;background:#fff !important}
  .ghl-form-wrap textarea:focus,.ghl-form-wrap input:focus{border-color:var(--hp-acc) !important;outline:none !important;box-shadow:0 0 0 3px rgba(255,106,0,.2) !important}

  /* Next = orange button, Back = quiet outline */
  .ghl-footer-next,.ghl-footer-back{cursor:pointer;border-radius:12px !important;font-size:19px !important;font-weight:800 !important;transition:background .15s,opacity .15s}
  .ghl-footer-next{background:var(--hp-acc) !important;padding:10px 22px !important;box-shadow:0 8px 18px rgba(255,106,0,.3)}
  .ghl-footer-next,.ghl-footer-next *{color:#ffffff !important}
  .ghl-footer-next svg,.ghl-footer-next svg *{stroke:#ffffff !important}
  .ghl-footer-next:hover{background:var(--hp-accd) !important}
  .ghl-footer-next[aria-disabled="true"]{background:#f2d9c7 !important;box-shadow:none;cursor:not-allowed}
  .ghl-footer-back{background:transparent !important;border:2px solid var(--hp-line) !important;padding:8px 18px !important}
  .ghl-footer-back,.ghl-footer-back *{color:#555555 !important}
  .ghl-footer-back svg,.ghl-footer-back svg *{stroke:#555555 !important}
  .ghl-footer-back:hover{background:var(--hp-soft) !important}
  @media(max-width:600px){
    .ghl-form-wrap label.field-label{font-size:20px !important}
    .option-radio label{font-size:17.5px !important;padding:12px 14px !important;min-height:58px !important}
    .ghl-footer-next,.ghl-footer-back{font-size:17px !important}
  }
</style>

<script>
(function(){
  if(window.__hpSkin4) return; window.__hpSkin4=true;
  var AUTO_NEXT=true;   // true = picking an answer goes to the next slide automatically
  var AUTO_DELAY=300;   // ms, so the person sees their choice light up first

  function sync(){
    document.querySelectorAll('.option-radio').forEach(function(o){
      var r=o.querySelector('input[type=radio]'); o.classList.toggle('ppr-sel',!!(r&&r.checked));
    });
  }
  document.addEventListener('change',function(e){
    var r=e.target; if(!r||!r.matches||!r.matches('.option-radio input[type=radio]')) return;
    sync();
    if(!AUTO_NEXT) return;
    var opt=r.closest('.option-radio');
    function press(){ var nx=document.querySelector('.ghl-footer-next'); if(nx && nx.getAttribute('aria-disabled')!=='true') nx.click(); }
    setTimeout(press,AUTO_DELAY);
    setTimeout(function(){ if(opt && opt.getBoundingClientRect().height>0 && r.checked) press(); },AUTO_DELAY+900);
  },true);
  document.addEventListener('click',function(e){
    var o=e.target&&e.target.closest&&e.target.closest('.option-radio');
    if(o && !e.target.closest('label') && !(e.target.matches&&e.target.matches('input'))){
      var r=o.querySelector('input[type=radio]'); if(r && !r.checked) r.click();
    }
    setTimeout(sync,0);
  },true);
  setTimeout(sync,500);
})();
</script>
