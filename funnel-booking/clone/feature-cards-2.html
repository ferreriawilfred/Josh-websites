<!-- ===== 2 FEATURE CARDS (icon + title + text) — copy & paste (GHL Custom HTML/JS) ===== -->
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
  .f2,.f2 *{box-sizing:border-box}
  .f2{display:block !important;width:100% !important;max-width:760px;margin:0 auto;padding:6px;font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
  .f2 .f2-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .f2 .f2-card{background:#fff;border:1px solid #e4e2da;border-radius:22px;padding:26px 22px 24px;text-align:center;box-shadow:0 8px 26px rgba(38,40,43,.08)}
  .f2 .f2-ic{display:flex;align-items:center;justify-content:center;height:48px;margin:0 0 10px;font-size:38px;line-height:1}
  .f2 .f2-ic img{display:block;width:44px;height:44px;object-fit:contain}
  .f2 .f2-t{margin:0 0 8px;font-family:'Barlow Condensed',Impact,'Arial Narrow',sans-serif;font-weight:700;font-size:28px;line-height:1.1;text-transform:uppercase;color:#26282b}
  .f2 .f2-p{margin:0;font-size:17px;line-height:1.5;color:#6b6f76}
  @media(max-width:600px){
    .f2 .f2-grid{grid-template-columns:1fr;gap:12px}
    .f2 .f2-card{padding:22px 16px 20px;border-radius:18px}
  }
</style>
<div class="f2"><div class="f2-grid">
  <div class="f2-card"><div class="f2-ic">📞</div><h3 class="f2-t">Free strategy call</h3><p class="f2-p">30 minutes, no obligation, with a real painter.</p></div>
  <div class="f2-card"><div class="f2-ic">🤝</div><h3 class="f2-t">Honest answer</h3><p class="f2-p">If we’re not a fit, we’ll tell you and point you to the right next step.</p></div>
</div></div>
