<!-- ===== TRUST BAR (glass cards + slide-up effect) — copy & paste (GHL Custom HTML/JS). Put it on a DARK section/background. ===== -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  .tb,.tb *{box-sizing:border-box}
  .tb{display:block !important;width:100% !important;max-width:620px;margin:0 auto;padding:6px 4px;font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#fff;text-align:left}
  .tb .tb-pill,.tb .tb-bar{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);box-shadow:0 10px 30px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .tb .tb-pill{display:inline-flex;align-items:center;gap:14px;padding:10px 22px 10px 12px;border-radius:999px;margin:0 0 12px}
  .tb .tb-avs{display:flex}
  .tb .tb-av{display:block;width:44px;height:44px;margin-left:-12px;border-radius:50%;border:2px solid #2a2a2a;background:#555 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='15' r='7' fill='%23bbb'/><path d='M6 40c0-9 6-14 14-14s14 5 14 14z' fill='%23bbb'/></svg>") center/cover;object-fit:cover}
  .tb .tb-av:first-child{margin-left:0}
  .tb .tb-big{display:block;font-weight:800;font-size:25px;line-height:1.05}
  .tb .tb-sm{display:block;margin-top:3px;font-size:15px;line-height:1.1;color:rgba(255,255,255,.72);letter-spacing:.02em}
  .tb .tb-bar{display:grid;grid-template-columns:1.25fr 1fr 1fr;border-radius:18px;padding:16px 6px}
  .tb .tb-it{display:flex;align-items:center;justify-content:center;gap:10px;padding:2px 10px;min-width:0}
  .tb .tb-it + .tb-it{border-left:1px solid rgba(255,255,255,.2)}
  .tb .tb-ic{flex:0 0 auto;width:30px;height:30px;display:block}
  .tb .tb-stars{display:block;color:#ffb400;font-size:13px;letter-spacing:2px;line-height:1;margin:0 0 3px}
  .tb .tb-val{display:block;font-weight:800;font-size:19px;line-height:1.1}
  .tb .tb-lbl{display:block;margin-top:2px;font-size:11.5px;line-height:1.15;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.7)}
  /* slide-up (only when JS is on and motion is allowed; otherwise everything is simply visible) */
  .tb.tb-js .tb-rise{opacity:0;transform:translateY(28px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
  .tb.tb-js .tb-rise.tb-in{opacity:1;transform:none}
  @media(max-width:520px){
    .tb{max-width:340px}
    .tb .tb-bar{padding:9px 0;border-radius:14px;grid-template-columns:1.15fr 1fr 1fr}
    .tb .tb-it{flex-direction:column;gap:3px;text-align:center;padding:1px 4px}
    .tb .tb-ic{width:20px;height:20px}
    .tb .tb-stars{font-size:9px;letter-spacing:1px;margin:0 0 2px}
    .tb .tb-val{font-size:14px}
    .tb .tb-lbl{font-size:8.5px;letter-spacing:.04em;margin-top:1px;white-space:nowrap}
    .tb .tb-g{display:flex;flex-direction:column;align-items:center;gap:3px}
    .tb .tb-pill{padding:7px 16px 7px 9px;gap:10px;margin-bottom:8px}
    .tb .tb-av{width:32px;height:32px;margin-left:-9px}
    .tb .tb-big{font-size:19px}
    .tb .tb-sm{font-size:12px}
  }
</style>

<div class="tb" id="tb">
  <div class="tb-pill tb-rise">
    <span class="tb-avs">
      <!-- to use real customer photos, replace each <span class="tb-av"></span> with: <img class="tb-av" src="PHOTO-URL" alt=""> -->
      <span class="tb-av"></span><span class="tb-av"></span><span class="tb-av"></span>
    </span>
    <span><span class="tb-big">1,000+</span><span class="tb-sm">Served</span></span>
  </div>

  <div class="tb-bar tb-rise" data-d="140">
    <div class="tb-it tb-g">
      <svg class="tb-ic" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      <span><span class="tb-stars" aria-label="5 stars">★★★★★</span><span class="tb-val">4.9 Rating</span><span class="tb-lbl">Google Reviews</span></span>
    </div>
    <div class="tb-it">
      <svg class="tb-ic" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg>
      <span><span class="tb-val">1,000+</span><span class="tb-lbl">Homes Painted</span></span>
    </div>
    <div class="tb-it">
      <svg class="tb-ic" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M12 3 5 6v5.5c0 4.4 2.9 7.9 7 9.5 4.1-1.6 7-5.1 7-9.5V6z"/><path d="m8.8 12 2.4 2.4 4.2-4.6"/></svg>
      <span><span class="tb-val">100%</span><span class="tb-lbl">Satisfaction</span></span>
    </div>
  </div>
</div>

<script>
(function(){
  if(window.__tbInit) return; window.__tbInit=true;
  var root=document.getElementById('tb');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!root||reduce||!('IntersectionObserver' in window)) return;   /* no animation: everything stays visible */
  var items=root.querySelectorAll('.tb-rise');
  root.classList.add('tb-js');
  var io=new IntersectionObserver(function(es){es.forEach(function(e){
    if(!e.isIntersecting) return;
    var el=e.target,d=+(el.getAttribute('data-d')||0);
    setTimeout(function(){el.classList.add('tb-in')},d); io.unobserve(el);
  })},{threshold:.2});
  items.forEach(function(el){io.observe(el)});
  setTimeout(function(){items.forEach(function(el){el.classList.add('tb-in')})},4000); /* safety net */
})();
</script>
