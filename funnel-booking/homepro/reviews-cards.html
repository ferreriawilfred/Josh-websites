<!-- ===== REVIEW CARDS (3 cards) — copy & paste (GHL Custom HTML/JS) =====
     To fill an empty card: replace the whole <div class="rv-card rv-empty">…</div> with a filled card (copy the first card and change the text).
     Use real customer reviews only. -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  .rv,.rv *{box-sizing:border-box}
  .rv{display:block !important;width:100% !important;max-width:1000px;margin:0 auto;padding:6px;font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#111}
  .rv .rv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
  .rv .rv-card{padding:22px 20px;background:#fff;border:1px solid #ffd9bd;border-radius:20px;box-shadow:0 10px 28px rgba(255,106,0,.12)}
  .rv .rv-stars{margin:0 0 10px;color:#ff6a00;font-size:22px;letter-spacing:.12em;line-height:1}
  .rv .rv-text{margin:0 0 14px;font-size:19px;line-height:1.6;color:#111}
  .rv .rv-by{margin:0;font-size:16px;font-weight:700;color:#4d4d4d}
  .rv .rv-empty{display:flex;align-items:flex-start;justify-content:center;min-height:300px;padding-top:26px;border:2px dashed #ff6a00;background:#fff1e6;box-shadow:none;text-align:center;font-weight:700;font-size:16px;color:#d95500}
  @media(max-width:760px){
    .rv .rv-grid{grid-template-columns:1fr;gap:12px}
    .rv .rv-card{padding:18px 16px;border-radius:18px}
    .rv .rv-text{font-size:18px}
    .rv .rv-empty{min-height:120px;align-items:center;padding-top:0}
  }
</style>

<div class="rv"><div class="rv-grid">
  <div class="rv-card">
    <p class="rv-stars" aria-label="5 stars">★★★★★</p>
    <p class="rv-text">“Home Pro Jobs transformed the outside of our home completely. Lanty and his crew were on time, clean, and the price was exactly what they quoted — no surprises.”</p>
    <p class="rv-by">— Michelle T., Akron, OH</p>
  </div>
  <div class="rv-card rv-empty">Add a real Google review here</div>
  <div class="rv-card rv-empty">Add a real Google review here</div>
</div></div>
