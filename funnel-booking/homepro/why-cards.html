<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  .wy,.wy *{box-sizing:border-box}
  .wy{display:block !important;width:100% !important;max-width:1000px;margin:0 auto;padding:6px;font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#111}
  .wy .wy-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .wy .wy-card{padding:24px 16px 22px;background:#fff;border:1px solid #ffd9bd;border-radius:20px;text-align:center;box-shadow:0 10px 28px rgba(255,106,0,.12)}

  .wy .wy-t{margin:0 0 8px;font-size:20px;font-weight:800;line-height:1.2;color:#111}
  .wy .wy-p{margin:0;font-size:17px;line-height:1.5;color:#4d4d4d}
  @media(max-width:760px){
    .wy .wy-grid{grid-template-columns:repeat(2,1fr);gap:12px}
    .wy .wy-card{padding:20px 12px 18px;border-radius:18px}
    .wy .wy-t{font-size:18px}
    .wy .wy-p{font-size:16px}
  }
</style>
