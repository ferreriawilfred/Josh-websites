<!-- ===== ORANGE-TINT GLASS BOX (for a dark section) — copy & paste (GHL Custom HTML/JS element) =====
     Made for a dark background (#111). Edit the text inside <div class="pk-box">. -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@700&display=swap');
  #pk-wrap,#pk-wrap *{box-sizing:border-box}
  #pk-wrap{max-width:760px;margin:0;padding:4px}
  #pk-wrap .pk-box{
    padding:22px 24px;border-radius:16px;
    background:rgba(255,106,0,.1);border:1px solid rgba(255,106,0,.5);
    font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif !important;
    font-size:22px;font-weight:700 !important;line-height:1.4;color:#ffffff;
  }
  @media(max-width:560px){
    #pk-wrap .pk-box{padding:18px 18px;font-size:18.5px}
  }
</style>

<div id="pk-wrap">
  <div class="pk-box">Pick the one that makes sense for where you are right now. Then let's get to work.</div>
</div>
